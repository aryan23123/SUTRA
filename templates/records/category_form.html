{% extends 'base.html' %}

{% block title %}Edit Category{% endblock %}

{% block content %}
    <div class="card">
        <div class="heading-row">
            <h1>Edit category</h1>
            <a href="{% url 'category_list' %}" class="button-link secondary">Back to categories</a>
        </div>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Save</button>
        </form>
    </div>
{% endblock %}
