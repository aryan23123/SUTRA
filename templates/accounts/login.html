{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
    <div class="card auth-card">
        <h2>Login</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Login</button>
        </form>
        <p>Need an account? <a href="{% url 'register' %}">Create one here</a>.</p>
    </div>
{% endblock %}
