{% extends 'base.html' %}

{% block title %}Create Account{% endblock %}

{% block content %}
    <div class="card auth-card">
        <h2>Create Account</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Register</button>
        </form>
        <p>Already registered? <a href="{% url 'login' %}">Log in</a>.</p>
    </div>
{% endblock %}
